INI:Missions:RA2_ALL01:Description=军事行动：孤独守卫
INI:Missions:RA2_ALL01:LongDescription=军事行动：孤独守卫@地点：纽约@@苏联入侵了！苏联军力足足有我方十倍之多。您必须协助身在纽约的特务谭@雅。指挥官，我们会尽快编列军队，但这需要点时间。纽约区有座小型美军@基地，布雷德利要塞。要是您能连络得上，他们就能协助您防守纽约。谭雅@会深入敌军重地。留意所有可能的目标，并且随时注意最新的任务目标。@@任务目标一：摧毁苏联无畏级舰队。@任务目标二：与布雷德利要塞取得联系。@任务目标三：谭雅不能殉职。
INI:Missions:RA2_ALL02:Description=军事行动：危机黎明
INI:Missions:RA2_ALL02:LongDescription=军事行动：危机黎明@地点：科罗拉多，空军学院@@苏联部队以洪水之势侵入美国。他们甚至攻入了我们的心脏地带，占领了科@罗拉多的空军学院。空军学院的学生和学院内的独特科技，对我军的防卫极@为重要。利用谭雅与此区域内的所有美军接触，将空军学院给抢回来，将苏@联军队驱逐出此区域。@@任务目标一：占领被苏联攻占的美国空军学院。@任务目标二：歼灭所有苏联军队。@任务目标三：谭雅不能阵亡。
INI:Missions:RA2_ALL03:Description=军事行动：为长官欢呼
INI:Missions:RA2_ALL03:LongDescription=军事行动：为长官欢呼@地点：华盛顿特区@@苏联入侵了华盛顿特区，利用他们那邪恶的心灵控制科技，掌控了我们的领@导人。您必须摧毁白宫附近的心灵信标，拯救这些领导人。@@任务目标一：摧毁心灵信标。
INI:Missions:RA2_ALL04:Description=军事行动：最后机会
INI:Missions:RA2_ALL04:LongDescription=军事行动：最后机会@地点：芝加哥@@苏联军队持续侵略美国各地。我方特务在芝加哥发现了一座大型心灵控制增@幅器。如果启动了，这项装置就能让苏联心灵控制整个北美洲。@@任务目标一：强力进行登陆并建立基地。@任务目标二：在心灵控制增幅器启用之前，将之摧毁。
INI:Missions:RA2_ALL05:Description=军事行动：暗夜
INI:Missions:RA2_ALL05:LongDescription=军事行动：暗夜@地点：波兰/德国边界@@欧洲军队仍然不愿与我们并肩作战，担心会遭受苏联用核武反击。我们发现@了苏联在波兰的中程飞弹基地。特务谭雅已经秘密潜入波兰边境。您必须指@引谭雅摧毁苏联的核弹。@@任务目标一：潜入苏联作战实验室。@任务目标二：破坏苏联两座核弹发射井。@任务目标三：谭雅不能殉职。
INI:Missions:RA2_ALL06:Description=军事行动：自由
INI:Missions:RA2_ALL06:LongDescription=军事行动：自由@地点：华盛顿特区@@欧洲盟友已经加入我们，是反击的时刻了。我们将反攻华盛顿，然后再从苏@联狗辈的手中逐一失复失土。@@任务目标一：增援并指挥五角大楼的盟军。@任务目标二：歼灭华盛顿所有苏联军队。
INI:Missions:RA2_ALL07:Description=军事行动：深海
INI:Missions:RA2_ALL07:LongDescription=军事行动：深海@地点：夏威夷，珍珠港@@苏联仍然占据地球的大部分区域。不论他们在何方，我们必须持续与他们作@战。情报指出苏联舰队正开往夏威夷途中。消灭这支舰队，太平洋就在我们@掌控之中了。@@任务目标一：消灭所有苏联军队。
INI:Missions:RA2_ALL08:Description=军事行动：自由门户
INI:Missions:RA2_ALL08:LongDescription=军事行动：自由门户@地点：密苏里州，圣路易斯@@虽然我们已经扫除了在美国本土的苏联军队，但他们仍然持续使用心灵控制@科技，不顾一切的希望他们那可悲的玩具能打倒我们。我们在圣路易斯发现@了一座心灵信标。派遣特务谭雅，摧毁那座心灵信标。@@任务目标一：摧毁苏联心灵信标。@任务目标二：消灭圣路易斯的所有苏联军队。@任务目标三：别让谭雅遇害。
INI:Missions:RA2_ALL09:Description=军事行动：太阳神殿
INI:Missions:RA2_ALL09:LongDescription=军事行动：太阳神殿@地点：墨西哥，图卢姆@@苏联军占领了我们西岸的一座基地，还有基地内的一座光棱塔。我们相信他@们一定正在尤卡坦的苏联研究设施，试图复制这项科技。一队海豹突击队已@经准备就绪，等候您的指示。@@任务目标一：占领或摧毁任何苏联企图复制我们光棱技术的建筑。@任务目标二：消灭防守研究设施的苏联基地。
INI:Missions:RA2_ALL10:Description=军事行动：海市蜃楼
INI:Missions:RA2_ALL10:LongDescription=军事行动：海市蜃楼@地点：德国，黑森林@@苏联军队孤注一掷反击了我们在德国的欧洲盟军，进军深入黑森林。他们的@指挥官无疑希望能找到爱因斯坦、占领他的实验室。我们需要您的天分。德@国人担心要是没有您出色的战略才能，他们就会吃败仗。@@任务目标一：确保爱因斯坦教授实验室的安全。@任务目标二：歼灭所有苏联军队。
INI:Missions:RA2_ALL11:Description=军事行动：核爆辐射尘
INI:Missions:RA2_ALL11:LongDescription=军事行动：核爆辐射尘@地点：佛罗里达之键@@爱因斯坦已经找到最适合超时空传送仪的地方了。很不幸的，地点很接近苏@联控制下的古巴。兴建超时空传送仪，并且清除此区的苏联核弹。我们就快@能对莫斯科发动最后攻击了。@@任务目标一：建造一座超时空传送仪。@任务目标二：解除古巴的苏联核武威胁。
INI:Missions:RA2_ALL12:Description=军事行动：超时空风暴
INI:Missions:RA2_ALL12:LongDescription=军事行动：超时空风暴@地点：莫斯科@@战争已经接近尾声了。一队特别挑选的自愿军将使用超时空传送仪传送至地@球另一端的莫斯科进行攻击。一旦你成功的取下克里姆林宫，我们将会俘虏@洛马诺夫，彻底停止苏联的侵略行动。您是唯一堪当重任的指挥官，祝您好@运！@@任务目标一：清除该区域，以供增援部队可以抵达。@任务目标二：消灭克里姆林宫周遭洛马诺夫的菁英警卫部队。
INI:Missions:RA2_ALLHD:Description=盟军战役 - 爱国者之热血
INI:Missions:RA2_HD:Description=红色警戒 2 战役
INI:Missions:RA2_INTRO:Description=介绍
INI:Missions:RA2_INTRO:LongDescription=1946 年，阿尔伯特·爱因斯坦使用超时空传送仪回到过去，永久改变了历史进程。@然而，爱因斯坦的善意之举打破了世界强国的微妙平衡，使约瑟夫·斯大林@领导的共产主义苏联得以对欧洲发动大规模入侵。@最初，苏联的入侵势如破竹，英国似乎将成为欧洲最后的自由之地。@但欧洲盟军奋起反击，最终粉碎了共产主义的战争机器。@斯大林战败后，亚历山大·洛马诺夫在盟军高层的认可下上台执政。@尽管身为贵族且为苏联共产党成员，洛马诺夫宣称主张和平。@然而，最新卫星情报显示，洛马诺夫可能背弃了承诺。@苏联军舰被发现在大西洋高速航行。@一名仅知其名为“尤里”的神秘人物，可能导致我方在苏联的整个秘密情报网@络瘫痪。@自从尤里成为洛马诺夫的首席顾问后，与苏联的关系急剧恶化，我方在当@地的特工失踪，部分甚至被发现与克格勃特工合作。@指挥官，我们必须为最坏的情况做好准备——与苏联的战争即将来临。
INI:Missions:RA2_SOV01:Description=军事行动：红色黎明
INI:Missions:RA2_SOV01:LongDescription=军事行动：红色黎明@地点：华盛顿特区@@你有幸成为苏联奇袭美国先锋部队的一员。带领你的部队通过华盛顿特区并@摧毁我们所憎恨的美国军力代表，五角大楼。@@任务目标一：摧毁五角大楼。
INI:Missions:RA2_SOV02:Description=军事行动：危机四伏
INI:Missions:RA2_SOV02:LongDescription=军事行动：危机四伏@地点：佛罗里达海岸@@愚蠢的美国人在佛罗里达东岸一处小港口集结了舰队。你必须强制登陆敌@方海岸，建立一座基地。维拉迪摩将军会率领无畏级战舰从旁协助你。一切@准备就绪后，你要向那群资本主义的猪㑩发动攻击，将他们彻底粉碎，踩在@苏联共产正义的脚下。@@任务目标一：强制登陆，建立一座基地。@任务目标二：歼灭所有敌军。
INI:Missions:RA2_SOV03:Description=军事行动：大苹果
INI:Missions:RA2_SOV03:LongDescription=军事行动：大苹果@地点：纽约@@为了完成我军的心灵信标，我们需要撷取美军科技。带领你的部队进入纽约@并占领其作战实验室，然后建造心灵信标以控制整座城市。@@任务目标一：占领美国作战实验室。@任务目标二：建造并保护心灵信标。
INI:Missions:RA2_SOV04:Description=军事行动：家乡前线
INI:Missions:RA2_SOV04:LongDescription=军事行动：家乡前线@地点：海参崴@@愚不可及的韩国人决定要投靠节节败退的盟军阵营。尝试要侵略我国东方领@土，但他们懦弱的企图必定失败。保卫祖国领土，准备就绪时，将韩国佬通@通打到海里去。@@任务目标一：建立一座基地。防卫祖国领土。@任务目标二：歼灭所有敌军。
INI:Missions:RA2_SOV05:Description=军事行动：灯火之城
INI:Missions:RA2_SOV05:LongDescription=军事行动：灯火之城@地点：法国，巴黎@@欧洲国家正在计划加入苟延残喘的美国阵营，我们绝不容忍这种挑衅行为，@你必须破坏他们美丽的巴黎。我们将会对盟军展示强大的军事实力，把他们@宝贵的名胜变成大规模杀伤性武器。@@任务目标一：使用磁暴步兵磁化埃菲尔铁塔并摧毁所有法国部队。@任务目标二：防卫埃菲尔铁塔免受盟军攻击。@任务目标三：摧毁所有剩余盟军部队。
INI:Missions:RA2_SOV06:Description=军事行动：划分
INI:Missions:RA2_SOV06:LongDescription=军事行动：划分@地点：夏威夷，珍珠港@@美国已经是穷途末路了，驻守于珍珠港的最后剩余舰队正无力的等候你最后@攻击。然而，我们发现韩国尚未被摧毁，并可能试图加入美国海军。绝不能@让他们成功。@@任务目标一：于夏威夷群岛建立基地。@任务目标二：摧毁盟军海军。
INI:Missions:RA2_SOV07:Description=军事行动：超时空防御战
INI:Missions:RA2_SOV07:LongDescription=军事行动：超时空防御战@地点：俄国，乌拉尔山@@美国人启动了超时空传送仪。这鬼机器能让他们将部队瞬间传送到远方，想@奇袭哪里，就奇袭哪里。你必须防守我军在乌拉尔山的作战实验室，美国人@肯定很快就会孤注一掷奇袭这里，阻止我们研发出究极主力坦克，但他们的@企图注定要失败。@@任务目标一：不计一切代价，防守作战实验室。
INI:Missions:RA2_SOV08:Description=军事行动：首都之辱
INI:Missions:RA2_SOV08:LongDescription=军事行动：首都之辱@地点：华盛顿特区@@值此伟大胜利的时刻，维拉迪摩将军背叛我们了。他受到舒适的美国生活方@式诱惑，竟然叛变了！还说服了许多原本忠诚的共产党同志一起背叛。你必@须到华盛顿特区，把躲在那里的无耻维拉迪摩给揪出来。@@任务目标一：占据白宫。
INI:Missions:RA2_SOV09:Description=军事行动：狐狸与猎犬
INI:Missions:RA2_SOV09:LongDescription=军事行动：狐狸与猎犬@地点：德州，圣安东尼奥@@胜利就在眼前。但美国总统侥幸逃脱，不过我们已经掌握了他的行踪，他逃@到德州圣奥东尼奥市那座叫做阿拉莫要塞的小地堡。你必须利用我们的超能@力部队，控制美国总统的心灵，强迫他让美国投降。@@任务目标一：利用心灵控制，俘虏美国总统。
INI:Missions:RA2_SOV10:Description=军事行动：残兵败将
INI:Missions:RA2_SOV10:LongDescription=军事行动：残兵败将@地点：美属维尔京群岛@@在被逼入绝境之际，盟军成功的研发出最新的超级科技。他们拥有天气控制@机，能用来创造可以击沉舰队、将城市夷为平地的闪电风暴。我们相信他们@将这末日武器藏在孤立的维尔京群岛上。@@任务目标一：占据美国作战实验室，找出天气控制机所在位置。@任务目标二：摧毁天气控制机。
INI:Missions:RA2_SOV11:Description=军事行动：红色革命
INI:Missions:RA2_SOV11:LongDescription=@军事行动：红色革命@地点：莫斯科@@尤里背叛我们了，这样的背叛行为只有死路一条。@@任务目标一：摧毁尤里的总部 - 克里姆林宫。
INI:Missions:RA2_SOV12:Description=军事行动：北极风暴
INI:Missions:RA2_SOV12:LongDescription=军事行动：北极风暴@地点：阿拉斯加，希望角@@我们找出最后一座仍在做无谓抵抗的盟军要塞了。他们的超时空传送仪，现@在已经完全发挥作用，能将部队传送到世界各个角落，到纽约、布拉格，甚@至莫斯科对我们发动突袭。尤里的文件中显示这项装置位于阿拉斯加的希望@之角。你必须在盟军使用这懦弱的科技之前，带领那区仅有的少数部队，发@动攻击。这是最后的决战时刻，指挥官！胜利就在眼前！@@任务目标一：摧毁超时空传送仪。
INI:Missions:RA2_SOVHD:Description=苏联战役 - 毁天灭地大行军
INI:Missions:RA2_TUT01:Description=新兵训练营 - 第一天
INI:Missions:RA2_TUT01:LongDescription=@新兵训练营 - 第一天@地点：最高机密@@这是基本训练，请听从中士的指令并遵命照办。
INI:Missions:RA2_TUT02:Description=新兵训练营 - 第二天
INI:Missions:RA2_TUT02:LongDescription=@新兵训练营 - 第二天@地点：最高机密@@这是您在基本训练营的最后一天。时间十分紧迫，苏联很快就会发动攻击。@仔细听好中士的指令，学习您应当做的，准备上战场吧！
INI:Missions:RA2_TUTHD:Description=新兵训练营
INI:Missions:YR_ALL01:Description=军事行动：光阴似箭
INI:Missions:YR_ALL01:LongDescription=军事行动：光阴似箭@地点：加州，旧金山@@时间所剩不多，尤里就快要让恶魔岛上的心灵控制器发挥作用了；我们唯一@的机会，就是利用爱因斯坦教授的时间机器，将我们送回以前，以便在尤里@完成他心灵控制器全球网络连线之前，能够及时阻止他。@@任务目标一：占领提供时间机器电力的发电厂。@任务目标二：保护时间机器。@任务目标三：摧毁在恶魔岛的心灵控制器。
INI:Missions:YR_ALL02:Description=军事行动：好莱坞，梦一场
INI:Missions:YR_ALL02:LongDescription=军事行动：好莱坞，梦一场@地点：加州，洛杉矶@@尤里已经控制了洛杉矶区居民的心智，并派市民进入部队回收厂当中，转变@成其进行心灵控制方案的资金。如果我们可以摧毁部队回收厂的话，尤里将@失去可观资金的收入来源。@@任务目标一：摧毁城市中所有的部队回收厂。@任务目标二：摧毁所有尤里的部队。
INI:Missions:YR_ALL03:Description=军事行动：集中攻击
INI:Missions:YR_ALL03:LongDescription=军事行动：集中攻击@地点：华盛顿州，西雅图@@由于我们已经阻止了尤里主要的资金来源，因此这位狂人决定要采取更直接@的侵略行动。尤里已经在西雅图建立了一座核弹发射井，并借此勒索巨软科@技集团的资金与科技；我们必须从尤里的核威胁下，拯救这座城市与巨软科@技。@@任务目标一：摧毁尤里的核弹发射井。@任务目标二：解救巨软园区。
INI:Missions:YR_ALL04:Description=军事行动：古墓奇击
INI:Missions:YR_ALL04:LongDescription=军事行动：古墓奇击@地点：埃及@@尤里已经抓住了爱因斯坦，并企图借以加速完成他的心灵控制器。我们必须@立刻拯救爱因斯坦，并消灭所有尤里在埃及的部队。@@任务目标一：摧毁金字塔四周的生化反应炉，并营救爱因斯坦。@任务目标二：摧毁尤里的基地。
INI:Missions:YR_ALL05:Description=军事行动：纽澳复制战
INI:Missions:YR_ALL05:LongDescription=军事行动：纽澳复制战@地点：澳大利亚，悉尼@@尤里已经在澳州悉尼建造了复制工厂，根据情报指出，他的目的是复制世界@各国领袖。我们必须不惜一切代价阻止这项行动。@@任务目标一：找出并摧毁尤里的复制基地。@任务目标二：摧毁尤里剩余部队。
INI:Missions:YR_ALL06:Description=军事行动：万圣节
INI:Missions:YR_ALL06:LongDescription=军事行动：万圣节@地点：英国，伦敦@@在复制世界各国领袖的行动失败之后，尤里改为计划俘虏真正的领袖！好好@的保护正在英国伦敦国会中的各国领袖们…并对付尤里。@@任务目标一：防止国会遭受攻击。@任务目标二：摧毁尤里的基地。
INI:Missions:YR_ALL07:Description=军事行动：脑死
INI:Missions:YR_ALL07:LongDescription=军事行动：脑死@地点：南极洲@@指挥官，一切都要结束了，尤里的阴谋都将化为乌有。然而，他在南极的某@地仍拥有一座仅存的心灵控制器。请将火地岛上的废弃苏联基地重新启用，@并建立一座雷达。如此我们就能侦测到尤里的准确位置。之后再联合盟军及@苏联的军队，来结束尤里的阴谋。@@任务目标一：建造苏联雷达。@任务目标二：摧毁南极的心灵控制器。@任务目标三：摧毁所有的尤里军队。
INI:Missions:YR_ALLHD:Description=盟军战役
INI:Missions:YR_HD:Description=尤里的复仇战役
INI:Missions:YR_INTRO:Description=介绍
INI:Missions:YR_INTRO:LongDescription=正当盟军庆祝胜利之时，尤里突然现身。他组建了一支由精神控制士兵和@基因突变生物组成的军队。多年来，尤里研发了多项新技术，其中最为邪恶@的是心灵控制器——一种能让尤里完全操控受害者意志的装置。尤里在全球@各地部署了多座心灵控制器，扬言一旦启动即可控制全人类的心智。@@盟军迅速对尤里位于阿尔卡特拉斯岛的基地发起突袭。尽管未能摧毁心灵控@制器，但成功削弱了其能源供应，使装置暂时无法启动。目前，盟军唯一的@希望是获取足够能源，启动爱因斯坦教授研发的时间机器，派遣部队穿越时@空，在心灵控制器激活前将其摧毁。@@然而，苏联另有打算，他们计划夺取时间机器，不仅要阻止尤里，还企图逆@转上次战争的结局！
INI:Missions:YR_SOV01:Description=军事行动：时空转移
INI:Missions:YR_SOV01:LongDescription=军事行动：时空转移@地点：加州，旧金山@@世界分崩离析。尤里安然自处的统治无人能敌。只有尝试盟军的大胆计划，@即将时间回到尤里开始阴谋和完全统治之间。但尤里的背叛必须由苏联亲手@惩罚，而不是盟军。我们必须夺取时间机器，亲自回到过去。@@任务目标一：摧毁盟军海军和巨炮。@任务目标二：摧毁时间机器四周的机枪碉堡，并占领时间机器。@任务目标三：占领四座电厂供时间机器使用。@任务目标四：掌控苏联基地并使用它摧毁心灵控制器。
INI:Missions:YR_SOV02:Description=军事行动：似曾相识
INI:Missions:YR_SOV02:LongDescription=军事行动：似曾相识@地点：德国，黑森林@@就是在黑森林这附近，我们由于爱因斯坦超时空传送仪的出现，而败给了盟@军；这一次，我们不能再失败了！摧毁爱因斯坦的实验室和其超时空传送仪@，以便确保与盟军的战争，获得属于我苏联伟大的胜利。@@任务目标一：摧毁守护德国边界的前哨站。@任务目标二：摧毁爱因斯坦的实验室与超时空传送仪。
INI:Missions:YR_SOV03:Description=军事行动：洗脑行动
INI:Missions:YR_SOV03:LongDescription=军事行动：洗脑行动@地点：英国，伦敦@@盟军已经在英国伦敦发现了一座心灵控制器，尤里已经控制了盟军的攻击部@队，以替他防守这座接近完成的心灵控制器；解救这些盟军，并联合他们一@起打败尤里…但请注意，这座控制器可能随时都会开始运转。@@任务目标一：摧毁心灵信标。@任务目标二：摧毁心灵控制器。@任务目标三：解决尤里的部队。
INI:Missions:YR_SOV04:Description=军事行动：北非谍影
INI:Missions:YR_SOV04:LongDescription=军事行动：北非谍影@地点：摩洛哥@@洛马诺夫总理的飞机被尤里的部队击落了。我们必须找出总理的位置，并护@送他到机场以便接受救援；尤里已经在机场周围建立了严密的基地，我们必@须先行将其消灭，以确保总理的安全。@@任务目标一：找出总理的下落，并保护他。@任务目标二：摧毁尤里防卫机场的基地。@任务目标三：等机场安全之后，保护洛马诺夫总理安全的到达机场。
INI:Missions:YR_SOV05:Description=军事行动：脱离地心引力
INI:Missions:YR_SOV05:LongDescription=军事行动：脱离地心引力@位置：太平洋中一个地图上未标明的小岛@@我们已经在太平洋一座未经标示的小岛上发现了尤里的秘密潜艇基地，必@须阻止来自尤里雷鸣攻击潜艇的威胁！@@任务目标一：选择登陆区域并建立一座基地。@任务目标二：搜寻并摧毁尤里的海军船坞。@任务目标三：消灭所有剩余尤里部队。
INI:Missions:YR_SOV06:Description=军事行动：飞向月球
INI:Missions:YR_SOV06:LongDescription=军事行动：飞向月球@地点：月球@@尤里计划在启动他的心灵控制器、笼罩全地球之后，将自己发射到月球上；@我们必须在月球上建立一座基地，以便建立一支足以摧毁尤里月球基地，@与月球指挥中心的攻击部队。@@任务目标一：寻找合适地点并建立基地。@任务目标二：锁定并摧毁尤里的月球指挥中心。@任务目标三：摧毁所有残存的尤里建筑物。
INI:Missions:YR_SOV07:Description=军事行动：首脑游戏
INI:Missions:YR_SOV07:LongDescription=军事行动：首脑游戏@地点：特兰西瓦尼亚@@为了躲避您的突击，尤里已经撤退回他在特兰西瓦尼亚的故乡，我们不允许@他有任何喘息的机会，否则他将有机会重整势力、再度卷土重来威胁我们全@体。将尤里永远的消灭吧！@@任务目标一：摧毁尤里的要塞。
